    for(var j=0;j<related.length;j++){
      var rm=MATURITY_CONFIG[related[j].maturity]||{label:'Unknown',cls:'b-dev'};
      html+='<a class="related-card" href="/applications/'+related[j].id+'"><span class="badge '+rm.cls+'">'+rm.label+'</span><h3>'+related[j].name+'</h3><p>'+related[j].problem+'</p></a>';
    }
    html+='</div></div>';
  }
  html+='<div class="back-link"><a href="/applications">\u2190 Back to all applications</a></div>';

  container.innerHTML = html;
})();

function copyAppLink(){
  var url = window.location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      var btn = document.getElementById('copyBtn');
      if(btn){
        btn.textContent = 'Copied!';
        setTimeout(function(){ btn.textContent = 'Copy Link'; }, 2000);
      }
    });
  } else {
    var inp = document.createElement('input');
    inp.value = url;
    document.body.appendChild(inp);
    inp.select();
    document.execCommand('copy');
    document.body.removeChild(inp);
    var btn = document.getElementById('copyBtn');
    if(btn){
      btn.textContent = 'Copied!';
      setTimeout(function(){ btn.textContent = 'Copy Link'; }, 2000);
    }
  }
}
</script>
</body>
