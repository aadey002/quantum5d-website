<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Quantum5D.ai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<style>
:root{--ink:#14112E;--muted:#5E5A78;--line:#E4E1EF;--purple:#4B3F9E;--purple-deep:#3A3080;--paper:#FCFBFE}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:520px;text-align:center}
.code{font-size:64px;font-weight:600;color:var(--purple);margin:0 0 8px;letter-spacing:-1px}
h1{font-size:24px;margin:0 0 12px}
p{color:var(--muted);line-height:1.6;margin:0 0 28px}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-block;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:500;font-size:15px;border:1px solid var(--line);color:var(--purple-deep);background:#fff}
a.primary{background:var(--purple);border-color:var(--purple);color:#fff}
a:hover{border-color:var(--purple)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link may be old or mistyped. Here are some good places to start.</p>
  <nav>
    <a class="primary" href="/">Home</a>
    <a href="/applications">Applications</a>
    <a href="/blog">Blog</a>
    <a href="/about">About</a>
  </nav>
</main>
</body>
</html>
