name: LinkedIn Engagement Tracker
# Pulls engagement metrics for all posted LinkedIn content daily

on:
  schedule:
    - cron: '0 22 * * *'  # 6pm ET (22:00 UTC) daily
  workflow_dispatch:

jobs:
  track-engagement:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch LinkedIn engagement data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e

          # Get LinkedIn access token
          TOKEN=$(curl -s \
            "$SUPABASE_URL/rest/v1/linkedin_accounts?select=access_token,linkedin_user_id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          ACCESS_TOKEN=$(echo "$TOKEN" | jq -r '.[0].access_token // empty')
          LI_USER_ID=$(echo "$TOKEN" | jq -r '.[0].linkedin_user_id // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "No LinkedIn access token found"
            exit 0
          fi

          # Get all posted LinkedIn posts with post IDs
          POSTS=$(curl -s \
            "$SUPABASE_URL/rest/v1/linkedin_posts?status=eq.posted&linkedin_post_id=not.is.null&select=id,linkedin_post_id" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          POST_COUNT=$(echo "$POSTS" | jq '. | length')
          echo "Found $POST_COUNT posted LinkedIn items to track"

          if [ "$POST_COUNT" = "0" ]; then
            echo "No posts to track"
            exit 0
          fi

          UPDATED=0

          echo "$POSTS" | jq -c '.[]' | while read -r POST; do
            POST_ID=$(echo "$POST" | jq -r '.id')
            LI_POST_ID=$(echo "$POST" | jq -r '.linkedin_post_id')

            # 1. Social actions: likes + comments
            STATS=$(curl -s \
              "https://api.linkedin.com/v2/socialActions/$LI_POST_ID?projection=(likesSummary,commentsSummary)" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "X-Restli-Protocol-Version: 2.0.0")

            LIKES=$(echo "$STATS" | jq -r '.likesSummary.totalLikes // 0')
            COMMENTS=$(echo "$STATS" | jq -r '.commentsSummary.totalFirstLevelComments // 0')

            # 2. Share statistics: impressions, clicks, shares/reposts
            # Encode the URN for the query parameter
            ENCODED_URN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$LI_POST_ID', safe=''))")
            SHARE_STATS=$(curl -s \
              "https://api.linkedin.com/v2/shareStatistics?shares=$ENCODED_URN&q=shares" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "X-Restli-Protocol-Version: 2.0.0")

            IMPRESSIONS=$(echo "$SHARE_STATS" | jq -r '.elements[0].totalShareStatistics.impressionCount // 0')
            UNIQUE_IMPRESSIONS=$(echo "$SHARE_STATS" | jq -r '.elements[0].totalShareStatistics.uniqueImpressionsCount // 0')
            CLICKS=$(echo "$SHARE_STATS" | jq -r '.elements[0].totalShareStatistics.clickCount // 0')
            SHARES=$(echo "$SHARE_STATS" | jq -r '.elements[0].totalShareStatistics.shareCount // 0')

            # Fallback: if shareStatistics returns nothing, try networkSizes approach
            if [ "$IMPRESSIONS" = "0" ] && [ "$CLICKS" = "0" ]; then
              # Try the socialMetadata endpoint as fallback
              META=$(curl -s \
                "https://api.linkedin.com/v2/socialMetadata/$LI_POST_ID" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "X-Restli-Protocol-Version: 2.0.0")

              META_SHARES=$(echo "$META" | jq -r '.shareCount // 0')
              if [ "$META_SHARES" != "0" ] && [ "$META_SHARES" != "null" ]; then
                SHARES=$META_SHARES
              fi
            fi

            # Build engagement JSON
            ENGAGEMENT=$(cat <<EJSON
            {
              "likes": $LIKES,
              "comments": $COMMENTS,
              "impressions": $IMPRESSIONS,
              "unique_impressions": $UNIQUE_IMPRESSIONS,
              "clicks": $CLICKS,
              "shares": $SHARES,
              "tracked_at": "$(date -u +%Y-%m-%dT%H:%M:%S)"
            }
          EJSON
            )
            # Compact JSON
            ENGAGEMENT=$(echo "$ENGAGEMENT" | jq -c '.')

            curl -s -X PATCH \
              "$SUPABASE_URL/rest/v1/linkedin_posts?id=eq.$POST_ID" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"engagement_data\": $ENGAGEMENT}"

            echo "Updated $POST_ID: $LIKES likes, $COMMENTS comments, $IMPRESSIONS impressions, $CLICKS clicks, $SHARES shares"
            UPDATED=$((UPDATED + 1))

            sleep 1
          done

          echo "Done. Updated engagement for $UPDATED posts."
