name: LinkedIn Engagement Tracker
# Pulls engagement metrics for all posted LinkedIn content daily

on:
  schedule:
    - cron: '0 22 * * *'  # 6pm ET (22:00 UTC) daily
  workflow_dispatch:

jobs:
  track-engagement:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch LinkedIn engagement data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e

          # Get LinkedIn access token (filter out rows with null linkedin_user_id)
          TOKEN=$(curl -s \
            "$SUPABASE_URL/rest/v1/linkedin_accounts?select=access_token,linkedin_user_id&linkedin_user_id=not.is.null&order=updated_at.desc&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          ACCESS_TOKEN=$(echo "$TOKEN" | jq -r '.[0].access_token // empty')
          LI_USER_ID=$(echo "$TOKEN" | jq -r '.[0].linkedin_user_id // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "No LinkedIn access token found"
            exit 0
          fi

          # Get all posted LinkedIn posts with post IDs
          POSTS=$(curl -s \
            "$SUPABASE_URL/rest/v1/linkedin_posts?status=eq.posted&linkedin_post_id=not.is.null&select=id,linkedin_post_id" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          POST_COUNT=$(echo "$POSTS" | jq '. | length')
          echo "Found $POST_COUNT posted LinkedIn items to track"

          if [ "$POST_COUNT" = "0" ]; then
            echo "No posts to track"
            exit 0
          fi

          UPDATED=0

          echo "$POSTS" | jq -c '.[]' | while read -r POST; do
            POST_ID=$(echo "$POST" | jq -r '.id')
            LI_POST_ID=$(echo "$POST" | jq -r '.linkedin_post_id')

            # Social actions: likes + comments (works for personal posts)
            ENCODED_URN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$LI_POST_ID', safe=''))")

            STATS=$(curl -s -w "\n%{http_code}" \
              "https://api.linkedin.com/v2/socialActions/$ENCODED_URN" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "X-Restli-Protocol-Version: 2.0.0")

            STATS_HTTP=$(echo "$STATS" | tail -1)
            STATS_BODY=$(echo "$STATS" | sed '$d')

            if [ "$STATS_HTTP" = "200" ]; then
              LIKES=$(echo "$STATS_BODY" | jq -r '.likesSummary.totalLikes // 0')
              COMMENTS=$(echo "$STATS_BODY" | jq -r '.commentsSummary.totalFirstLevelComments // 0')
            else
              echo "  socialActions HTTP $STATS_HTTP for $LI_POST_ID"
              echo "  $STATS_BODY"
              LIKES=0
              COMMENTS=0
            fi

            # Note: impressions/clicks/shares require Organization Statistics permission
            # (r_organization_social) which is not available for personal profiles.
            # These remain 0 until a Company Page is configured.
            IMPRESSIONS=0
            UNIQUE_IMPRESSIONS=0
            CLICKS=0
            SHARES=0

            # Build engagement JSON
            ENGAGEMENT=$(cat <<EJSON
            {
              "likes": $LIKES,
              "comments": $COMMENTS,
              "impressions": $IMPRESSIONS,
              "unique_impressions": $UNIQUE_IMPRESSIONS,
              "clicks": $CLICKS,
              "shares": $SHARES,
              "tracked_at": "$(date -u +%Y-%m-%dT%H:%M:%S)"
            }
          EJSON
            )
            # Compact JSON
            ENGAGEMENT=$(echo "$ENGAGEMENT" | jq -c '.')

            curl -s -X PATCH \
              "$SUPABASE_URL/rest/v1/linkedin_posts?id=eq.$POST_ID" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"engagement_data\": $ENGAGEMENT}"

            echo "Updated $POST_ID: $LIKES likes, $COMMENTS comments, $IMPRESSIONS impressions, $CLICKS clicks, $SHARES shares"
            UPDATED=$((UPDATED + 1))

            sleep 1
          done

          echo "Done. Updated engagement for $UPDATED posts."
