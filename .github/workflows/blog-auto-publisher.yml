name: Blog Auto-Publisher

on:
  schedule:
    - cron: '0 13 * * *'  # 9am ET (13:00 UTC) daily
  workflow_dispatch:

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Publish due blog posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Find posts with status='scheduled' and published_date <= now
          # Update them to status='published'
          RESULT=$(curl -s -X PATCH \
            "$SUPABASE_URL/rest/v1/blog_posts?status=eq.scheduled&published_date=lte.$(date -u +%Y-%m-%dT%H:%M:%S)" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"status": "published"}')

          echo "Published posts: $RESULT"

          # Check if any posts were actually published (non-empty array response)
          if echo "$RESULT" | grep -q '"id"'; then
            echo "Posts were published — triggering site rebuild."
            echo "POSTS_PUBLISHED=true" >> $GITHUB_ENV
          else
            echo "No posts published today."
            echo "POSTS_PUBLISHED=false" >> $GITHUB_ENV
          fi

      - name: Trigger quantum5d.ai rebuild
        if: env.POSTS_PUBLISHED == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "WARNING: VERCEL_DEPLOY_HOOK_URL not set — skipping rebuild."
            exit 0
          fi
          DEPLOY_RESULT=$(curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Deploy hook response: $DEPLOY_RESULT"
